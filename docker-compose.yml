name: invoice-agent   # pinned so moving this file doesn't orphan the existing volume/container
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ap
      POSTGRES_PASSWORD: ap
      POSTGRES_DB: invoice_agent
    ports:
      - "5433:5432"   # host 5433: avoids clashing with a locally-installed Postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
